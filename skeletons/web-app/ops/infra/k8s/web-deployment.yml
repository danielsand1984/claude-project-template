apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}-web
  labels:
    app.kubernetes.io/name: {{PROJECT_NAME}}-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{PROJECT_NAME}}-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{PROJECT_NAME}}-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: REGISTRY/{{PROJECT_NAME}}-web:TAG
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: {{PROJECT_NAME}}-config
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{PROJECT_NAME}}-web
spec:
  selector:
    app.kubernetes.io/name: {{PROJECT_NAME}}-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
