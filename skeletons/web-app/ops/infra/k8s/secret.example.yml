# THIS FILE IS AN EXAMPLE. DO NOT COMMIT REAL SECRETS.
#
# In production, use one of:
# - Sealed Secrets (bitnami-labs/sealed-secrets) — encrypted YAML safe to commit
# - External Secrets Operator — pulls from Vault / Azure Key Vault / AWS Secrets Manager
# - Helm values file kept outside git (with --values secrets.local.yml)
#
# Plain Secret manifests are base64-encoded, NOT encrypted. Treat them like cleartext.

apiVersion: v1
kind: Secret
metadata:
  name: {{PROJECT_NAME}}-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/{{PROJECT_NAME}}"
  REDIS_URL: "redis://:PASSWORD@HOST:6379"
  ANTHROPIC_API_KEY: "sk-ant-REPLACE_ME"
