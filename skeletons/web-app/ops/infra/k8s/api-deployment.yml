apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}-api
  labels:
    app.kubernetes.io/name: {{PROJECT_NAME}}-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{PROJECT_NAME}}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{PROJECT_NAME}}-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: REGISTRY/{{PROJECT_NAME}}-api:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: {{PROJECT_NAME}}-config
            - secretRef:
                name: {{PROJECT_NAME}}-secrets
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem: true means the container can't write
            # anywhere in the image. pg, ioredis reconnect, body parsing,
            # and tsx/V8 caching all write to /tmp — give it a writable
            # emptyDir so those don't fail with EROFS.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{PROJECT_NAME}}-api
spec:
  selector:
    app.kubernetes.io/name: {{PROJECT_NAME}}-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
