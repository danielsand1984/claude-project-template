# Template for a single worker type. Copy + rename per worker (e.g. ai-worker, import-worker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT_NAME}}-WORKER_NAME
  labels:
    app.kubernetes.io/name: {{PROJECT_NAME}}-WORKER_NAME
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{PROJECT_NAME}}-WORKER_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{PROJECT_NAME}}-WORKER_NAME
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: REGISTRY/{{PROJECT_NAME}}-WORKER_NAME:TAG
          envFrom:
            - configMapRef:
                name: {{PROJECT_NAME}}-config
            - secretRef:
                name: {{PROJECT_NAME}}-secrets
          # Workers don't expose HTTP. Liveness checks a heartbeat file
          # the worker touches after every successful queue consume.
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/worker_heartbeat -mmin -2"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60   # workers may need longer to finish in-flight jobs
